name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build:web

      # La console d'administration est un autre site : elle emporte depuis
      # apps/web ce dont elle a besoin, et se sert à part (apps/console).
      # Elle emporte aussi pdf.js, que « build:web » vient de copier : cette
      # étape passe donc après, et elle échoue bruyamment si ce n'est pas le cas.
      - name: Build console
        run: npm run build:console

      - name: Prepare site
        run: |
          mkdir -p dist
          cp -R apps/web/. dist/
          # Servie sous « console/ », à côté de l'application et jamais dedans :
          # ce qui n'est pas dans la page des utilisateurs ne s'y lit pas.
          mkdir -p dist/console
          cp -R apps/console/. dist/console/
          # De quoi savoir, depuis l'écran, quelle version est servie. Sans ce
          # repère, un défaut corrigé et un défaut persistant se ressemblent :
          # on refait le test sur l'ancienne page sans le savoir.
          printf '{"commit":"%s","court":"%s","le":"%s"}\n' \
            "$GITHUB_SHA" "$(echo "$GITHUB_SHA" | cut -c1-7)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/build.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
