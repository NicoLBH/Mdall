name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build:web

      - name: Prepare site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p dist
          cp -R apps/web/. dist/
          cat > dist/config.js <<EOF
          window.MDALL_CONFIG = window.MDALL_CONFIG || {};
          window.MDALL_CONFIG.supabaseUrl = "${SUPABASE_URL:-https://nsdgfxnvwoieroyaxzxb.supabase.co}";
          window.MDALL_CONFIG.supabaseAnonKey = "${SUPABASE_ANON_KEY}";
          window.SUPABASE_URL = window.MDALL_CONFIG.supabaseUrl;
          window.SUPABASE_ANON_KEY = window.MDALL_CONFIG.supabaseAnonKey;
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
